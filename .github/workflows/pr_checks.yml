
name: PR Quality Checks

on:
  pull_request:
    branches: [developer]

jobs:
  check-html-titles:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check all HTML files have title tags
        run: |
          HTML_FILES=$(find . -type f -name "*.html" -not -path "./.git/*")

          if [ -z "$HTML_FILES" ]; then
            echo "ERROR: No HTML files found"
            exit 1
          fi

          for file in $HTML_FILES; do
            if ! grep -Eiq "<title>" "$file"; then
              echo "ERROR: $file is missing title tag"
              exit 1
            fi
          done

          echo "All HTML files have title tags"

  check-image-alt:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check images have alt attributes
        run: |
          MISSING=$(grep -rnE '<img[^>]*' \
            --include="*.html" . | grep -viE '\balt[[:space:]]*=' || true)

          if [ -n "$MISSING" ]; then
            echo "ERROR: Images missing alt attributes:"
            echo "$MISSING"
            exit 1
          fi

          echo "All images have alt attributes"

  check-no-console-log:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check for console.log in JavaScript
        run: |
          if grep -rn --include="*.js" \
            --exclude-dir=".git" "console.log" .; then

            echo "WARNING: Remove console.log before merging"
            exit 1
          fi

          echo "No console.log found"

  all-checks-passed:
    runs-on: ubuntu-latest

    needs:
      - check-html-titles
      - check-image-alt
      - check-no-console-log

    steps:
      - name: All checks passed
        run: echo "All PR checks passed! Ready for review."
