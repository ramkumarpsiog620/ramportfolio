
name: Validate HTML & CSS

on:
  push:
    branches: [developer]
  pull_request:
    branches: [developer]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install validation tools
        run: |
          npm install -g htmlhint
          npm install --no-save postcss

      - name: Validate HTML files
        run: htmlhint "*.html" --config .htmlhintrc

      - name: Validate CSS files
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const postcss = require("postcss");

          const dir = "css";

          if (!fs.existsSync(dir)) {
            console.error("CSS folder not found!");
            process.exit(1);
          }

          const files = fs.readdirSync(dir)
            .filter(file => file.endsWith(".css"));

          if (files.length === 0) {
            console.error("No CSS files found!");
            process.exit(1);
          }

          let failed = false;

          for (const file of files) {
            try {
              const content = fs.readFileSync(
                path.join(dir, file), "utf8"
              );

              postcss.parse(content, { from: file });
              console.log(`PASS: ${file}`);
            } catch (error) {
              failed = true;
              console.error(
                `ERROR: ${file}:${error.line}:${error.column}`
              );
              console.error(error.reason);
            }
          }

          if (failed) process.exit(1);

          console.log("All CSS files passed syntax validation!");
          '
